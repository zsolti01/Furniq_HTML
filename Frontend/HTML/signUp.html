<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="icon" type="image/x-icon" href="../Img/Logos/favicon.png">
    <title>Furniq - Sign up</title>
</head>

<body>
    <img src="../Img/Logos/logo2.png" alt="Furniq Logo" id="logoMain" />
    <p id="mottoP" style="font-size: 25px; margin-bottom: 30px; margin-top: -15px; ">Designed for Living</p>

    <form id="signInUpForm">
        <label for="name">Full Name</label><br>
        <input type="text" id="name" name="name" autocomplete="name" required style="margin-bottom: 22px;"><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" name="email" autocomplete="email" required style="margin-bottom: 22px;"><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" required minlength="8" style="margin-bottom: 22px;"><br>

        <label for="confPassword">Confirm Password</label><br>
        <input type="password" id="confPassword" name="confPassword" required minlength="8"
            style="margin-bottom: 22px;"><br>
    </form>

    <a href="main.html" class="BtnLink"><button>Sign up</button></a>
    <div id="signLink">
        <p>Already have a profile?</p>
        <a href="signIn.html">Sign in</a>
    </div>
    <h1 style="margin-bottom: 60px;"></h1>
</body>

</html>
