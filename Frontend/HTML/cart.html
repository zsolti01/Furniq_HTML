<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="icon" type="image/x-icon" href="../Img/Logos/favicon.png">
    <title>Furniq - Cart</title>
</head>

<body>
    <img src="../Img/Logos/logo2.png" alt="Furniq Logo" id="logoMain" />
    <p id="mottoP" style="font-size: 25px; margin-bottom: 30px; margin-top: -15px; ">Designed for Living</p>
    <div id="links">
        <a href="main.html" class="navLinks"><button>Home</button></a>
        <a href="profile.html" class="navLinks"><button>Profile</button></a>
    </div>

    <hr>

    <main id="cartMain" style="margin-top: 50px;">

        <div id="products">
            <!-- Products -->
            <h3>Products in your cart</h3>

            <br>

            <img style="margin-top: -50px; background-color: white;"
                src="https://img.butor1.hu/detailed/3098/table-houston-939_3098052.jpg?w=1600&h=1200&func=fit&org_if_sml=1"
                alt="Your most recently ordered furniture">
            <p class="exampleP" style="margin-top: 10px; font-size: 30px;">Wooden Table</p>
            <p class="exampleP">Kitchen - Dining</p>
            <p class="exampleP">69 990 Ft</p>
            <button class="profileDivButton">Details</button>

            <br>
            <hr>

            <img style="margin-top: 30s0px; background-color: white;"
                src="https://img.butor1.hu/detailed/3718/bedside-table-sordoro-100-graphite-artisan-oak_3718020.jpg?w=460&h=345&p=fw"
                alt="Your most recently ordered furniture">
            <p class="exampleP" style="margin-top: 10px; font-size: 30px;">2 drawer nightstand</p>
            <p class="exampleP">Bedroom</p>
            <p class="exampleP">39 990 Ft</p>
            <button class="profileDivButton">Details</button>

            <br>
            <hr>

            <img style="margin-top: 30s0px; background-color: white;"
                src="https://img.butor1.hu/detailed/2760/coat-rack-norsica-sevferi-149_2760196.jpg?w=460&h=345&p=fw"
                alt="Your most recently ordered furniture">
            <p class="exampleP" style="margin-top: 10px; font-size: 30px;">Coat rack</p>
            <p class="exampleP">Hallway</p>
            <p class="exampleP">54 990 Ft</p>
            <button class="profileDivButton">Details</button>
        </div>

        <div id="summary">
            <!-- Summary -->
            <h3>Order summary</h3>

            <p class="exampleP" style="margin-top: 10px;">Products in your car: 3</p>
            <p class="exampleP">Final price: 164 970 Ft</p>
            <button class="profileDivButton">Continue shopping</button>
            <button class="profileDivButton">To checkout</button>

        </div>

    </main>

</body>

</html>
